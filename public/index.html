<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="screen join-screen active">
            <div class="form">
                <h2>Join ChatHub</h2>
                <div class="form-input">
                    <label for="username">Username</label>
                    <input type="text" id="username">
                    <div class="form-input">
                        <label for="avatar">Choose Display Picture</label>
                        <input type="file" id="avatar" accept=", .jpg, .jpg, .png">
                    </div>
                </div>                
                <div class="form-input">
                    <button id="join-user" type="button">Join</button>
                    <p>or</p><br>
                    <button>
                        <a style="text-decoration: none; color: #fff;" href="./public2/index.html">
                            Chat with Bot
                        </a>
                    </button>
                </div>
                
            </div>
        </div>
        <div class="screen chat-screen" id="con">
            <div class="header">
                <div class="logo">ChatHub</div>
                <h3 style="color: #fff;">General Room</h3>
                <button id="exit-chat">Exit</button>
            </div>
            <div class="messages" ></div>
            <div class="typebox">
                <textarea name="messages" id="message-input" placeholder="Message ..." cols="30" rows="10"></textarea>
                <button id="send-message">Send</button>
            </div>
        </div>
        <div class="screen room-screen">
            <div class="header">
                <h2>Rooms</h2>
                <input type="text" id="new-room-name" placeholder="New room name">
                <button id="create-room">Create Room</button>
            </div>
            <ul id="room-list"></ul>
        </div>
    </div>
    <script type="text/javascript" src="/socket.io/socket.io.js"></script>
    <script type="text/javascript" src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
<script>
  const socket = io("https://your-socket-io-server-url");
</script>
</body>
</html>
